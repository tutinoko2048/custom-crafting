name: CI

on:
  push:
    branches: ['**']
  pull_request:

env:
  # CI では git フックを入れない
  VP_GIT_HOOKS: 0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Check
        run: pnpm exec vp check

      - name: Test
        run: pnpm run test
